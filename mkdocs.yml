site_name: FlowDesk
site_description: Your personal knowledge memory system — bookmarks, notes, code, routine, expenses and AI in one place.
site_url: https://masudranaxpert.github.io/flowdesk/
repo_url: https://github.com/masudranaxpert/flowdesk
repo_name: masudranaxpert/flowdesk
copyright: Copyright &copy; Masud Rana

theme:
  name: material
  palette:
    # Palette toggle based on media preference
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
  icon:
    repo: fontawesome/brands/github
  logo: assets/og-image.png
  favicon: assets/og-image.png

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/masudranaxpert
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Configuration: configuration.md
  - Going Live:
      - Deploy to Cloudflare: deployment.md
      - Android App: android.md
  - Reference:
      - Features: features.md
      - Security: security.md
      - Development: development.md
